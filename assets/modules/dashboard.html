<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Twins Fitness | Dashboard</title>
	<link rel="stylesheet" href="../css/root.css">
	<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<div class="dashboard-layout">
		<aside class="sidebar">
			<div class="sidebar-brand">
				<span>Twins</span>
				<small>Fitness Club</small>
			</div>
			<nav class="sidebar-nav" aria-label="Main navigation">
				<a class="sidebar-link is-active" href="#">Dashboard</a>
				<a class="sidebar-link" href="#">Branches</a>
				<a class="sidebar-link" href="#">Clients</a>
				<a class="sidebar-link" href="#">Attendance</a>
				<a class="sidebar-link" href="#">Employees</a>
				<a class="sidebar-link" href="#">Reports</a>
				<a class="sidebar-link" href="#">Settings</a>
			</nav>
		</aside>

		<main class="dashboard">
			<header class="dashboard-header">
				<div>
					<h1>Dashboard</h1>
					<p class="subtle-text">Overview of today and key totals.</p>
				</div>
				<div class="dashboard-date">
					<span class="subtle-text">Updated:</span>
					<strong>May 31, 2026</strong>
				</div>
			</header>

			<section class="stats-grid" aria-label="Key analytics">
				<article class="panel-card stat-card">
					<div class="stat-label">Branches</div>
					<div class="stat-value">6</div>
					<div class="stat-meta subtle-text">Active locations</div>
				</article>

                <article class="panel-card stat-card">
					<div class="stat-label">Employees</div>
					<div class="stat-value">48</div>
					<div class="stat-meta subtle-text">Active staff</div>
				</article>

				<article class="panel-card stat-card">
					<div class="stat-label">Clients</div>
					<div class="stat-value">1,248</div>
					<div class="stat-meta subtle-text">Registered members</div>
				</article>

				<article class="panel-card stat-card">
					<div class="stat-label">Today's Attendance</div>
					<div class="stat-value">312</div>
					<div class="stat-meta subtle-text">Checked in today</div>
				</article>

			</section>
		</main>
	</div>
</body>
</html>
